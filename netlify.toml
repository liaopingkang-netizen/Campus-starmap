# 校招星图 · Netlify 部署配置
[build]
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 每日自动采集 + 自动下架过期岗位（00:00 UTC = 北京时间 08:00）
[functions."daily-harvest"]
  schedule = "0 0 * * *"

# 所有 /api/* 请求交给无服务器函数处理（200 为内部重写，浏览器地址不变）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 单页应用回退：未知路径返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
